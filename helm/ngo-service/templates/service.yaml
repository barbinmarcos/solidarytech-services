apiVersion: v1
kind: Service
metadata:
  name: ngo-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: ngo-service

spec:
  type: {{ .Values.service.type }}

  selector:
    app: ngo-service

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
