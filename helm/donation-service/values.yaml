replicaCount: 2

image:
  repository: 212792011616.dkr.ecr.us-east-1.amazonaws.com/solidarytech-donation-service
  tag: v7
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: donation-service

service:
  type: ClusterIP
  port: 8082

containerPort: 8082

env:
  AWS_REGION: us-east-1
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/212792011616/solidarytech-donation-events

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60

otel:
  endpoint: "otlp.nr-data.net:4318"

simulateLatencyMs: "2500"
