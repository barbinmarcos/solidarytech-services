apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volunteer-service
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - solidarytech

  selector:
    matchLabels:
      app: volunteer-service

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
