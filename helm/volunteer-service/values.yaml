replicaCount: 1

image:
  repository: 212792011616.dkr.ecr.us-east-1.amazonaws.com/solidarytech-volunteer-service
  tag: v2
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: volunteer-service

service:
  type: ClusterIP
  port: 8083

containerPort: 8083

env:
  AWS_REGION: us-east-1
  AWS_DYNAMODB_TABLE: solidarytech-volunteers

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
