services:

  postgres:
    image: postgres:16-alpine
    container_name: solidarytech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solidarytech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ngo-service/db/init.sql:/docker-entrypoint-initdb.d/01-ngo.sql:ro
      - ./donation-service/db/init.sql:/docker-entrypoint-initdb.d/02-donation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solidarytech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solidarytech-network

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: solidarytech-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    networks:
      - solidarytech-network

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: solidarytech-dynamodb-init
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - dynamodb
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Aguardando DynamoDB..."

        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 --region us-east-1 >/dev/null 2>&1; do
          sleep 2
        done

        echo "DynamoDB disponível."

        if aws dynamodb describe-table --table-name solidarytech-volunteers --endpoint-url http://dynamodb:8000 --region us-east-1 >/dev/null 2>&1; then
          echo "Tabela solidarytech-volunteers já existe."
        else
          echo "Criando tabela solidarytech-volunteers..."

          aws dynamodb create-table \
            --table-name solidarytech-volunteers \
            --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
            --key-schema AttributeName=volunteer_id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://dynamodb:8000 \
            --region us-east-1

          echo "Tabela criada com sucesso."
        fi
    networks:
      - solidarytech-network

  ngo-service:
    build:
      context: ./ngo-service
    image: solidarytech/ngo-service:local
    container_name: ngo-service
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solidarytech
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solidarytech-network

  donation-service:
    build:
      context: ./donation-service
    image: solidarytech/donation-service:local
    container_name: donation-service
    environment:
      PORT: 8082
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solidarytech
      AWS_REGION: us-east-1
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solidarytech-network

  volunteer-service:
    build:
      context: ./volunteer-service
    image: solidarytech/volunteer-service:local
    container_name: volunteer-service
    environment:
      PORT: 8083
      AWS_REGION: us-east-1
      AWS_DYNAMODB_TABLE: solidarytech-volunteers
      AWS_DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
    ports:
      - "8083:8083"
    depends_on:
      - dynamodb-init
    networks:
      - solidarytech-network

networks:
  solidarytech-network:
    driver: bridge

volumes:
  postgres-data:
