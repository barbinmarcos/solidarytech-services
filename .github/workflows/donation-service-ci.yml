name: Donation Service CI/CD

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "donation-service/**"
      - ".github/workflows/donation-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "donation-service/**"
      - ".github/workflows/donation-service-ci.yml"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: solidarytech-donation-service

jobs:
  ci:
    name: Test and Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: donation-service

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: donation-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Unit tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10

      - name: SAST report - gosec
        run: gosec -no-fail ./...

      - name: SAST gate - HIGH
        run: gosec -severity high -confidence high ./...

      - name: SCA - Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: donation-service
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build:
    name: Build Scan Push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect GitHub OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${TOKEN_RESPONSE}" | \
            python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          export TOKEN

          python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          keys = [
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
              "event_name",
              "workflow",
          ]

          print("=== GitHub OIDC Claims ===")

          for key in keys:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::212792011616:role/solidarytech-prod-github-actions-role
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            ./donation-service

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Update GitOps image tag
        run: |
          sed -i \
            "s/^  tag: .*/  tag: ${{ github.sha }}/" \
            helm/donation-service/values.yaml

          echo "Nova configuração:"
          grep -A3 '^image:' helm/donation-service/values.yaml

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/donation-service/values.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração GitOps necessária."
            exit 0
          fi

          git commit -m "chore: deploy donation-service ${{ github.sha }}"
          git push origin HEAD:main
